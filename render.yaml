# [LEGACY CONFIGURATION - Node.js Deployment]
# Note: The active production architecture is PHP 8.2+ REST API + MySQL 8+ on cPanel/Apache.
# See DEPLOYMENT_CPANEL.md for the official deployment guide.
services:
  - type: web
    name: pakistan-hardware-store
    runtime: node
    plan: starter # Starter plan or higher is required on Render to attach a Persistent Disk
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_PATH
        value: /var/data/hardware_store.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
